<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tcTitle">
  <title id="tcTitle">Labeled cross-section of a jar terrarium: rocks at the bottom, then charcoal, then soil, then plants, with mist and a lid on top and indirect light — water cycles inside the closed jar</title>
  <defs>
    <marker id="tcA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="618" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Inside the Terrarium Jar</text>
  <text x="380" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">A tiny world in layers &#8212; the water stays inside and keeps moving around.</text>

  <!-- sun / indirect light -->
  <g transform="translate(120 130)">
    <circle r="26" fill="#fde047"/>
    <g stroke="#fde047" stroke-width="4" stroke-linecap="round">
      <line x1="34" y1="0" x2="52" y2="0"/><line x1="24" y1="24" x2="37" y2="37"/><line x1="0" y1="34" x2="0" y2="52"/><line x1="24" y1="-24" x2="37" y2="-37"/>
    </g>
  </g>
  <text x="120" y="205" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#854d0e">indirect light</text>
  <text x="120" y="222" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">(near a window,</text>
  <text x="120" y="237" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">not baking sun)</text>

  <!-- jar -->
  <g>
    <!-- lid -->
    <rect x="285" y="96" width="190" height="26" rx="8" fill="#94a3b8"/>
    <rect x="272" y="118" width="216" height="12" rx="6" fill="#64748b"/>
    <!-- glass -->
    <path d="M272,130 L272,540 Q272,570 302,570 L458,570 Q488,570 488,540 L488,130 Z" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="3.5"/>
    <!-- layers -->
    <path d="M276,536 Q276,566 304,566 L456,566 Q484,566 484,536 L484,500 L276,500 Z" fill="#94a3b8"/>
    <rect x="276" y="472" width="208" height="28" fill="#334155"/>
    <rect x="276" y="408" width="208" height="64" fill="#92400e"/>
    <!-- plants -->
    <g>
      <path d="M330,408 C325,370 335,350 330,330" stroke="#166534" stroke-width="5" fill="none"/>
      <ellipse cx="318" cy="332" rx="16" ry="9" fill="#16a34a" transform="rotate(-30 318 332)"/>
      <ellipse cx="342" cy="325" rx="16" ry="9" fill="#16a34a" transform="rotate(25 342 325)"/>
      <path d="M395,408 C398,360 388,340 393,305" stroke="#166534" stroke-width="6" fill="none"/>
      <ellipse cx="378" cy="310" rx="20" ry="11" fill="#22c55e" transform="rotate(-28 378 310)"/>
      <ellipse cx="410" cy="298" rx="20" ry="11" fill="#22c55e" transform="rotate(24 410 298)"/>
      <path d="M445,408 C448,385 442,375 446,360" stroke="#166534" stroke-width="4" fill="none"/>
      <ellipse cx="447" cy="355" rx="13" ry="8" fill="#4ade80"/>
    </g>
    <!-- mist droplets -->
    <g fill="#38bdf8">
      <circle cx="310" cy="175" r="5"/><circle cx="360" cy="155" r="4"/><circle cx="420" cy="170" r="5"/><circle cx="455" cy="150" r="4"/>
    </g>
    <!-- internal water cycle arrows -->
    <g stroke="#0ea5e9" stroke-width="3" fill="none">
      <path d="M320,390 C300,320 300,240 330,195" marker-end="url(#tcA)"/>
      <path d="M430,195 C462,240 462,320 442,390" marker-end="url(#tcA)"/>
    </g>
    <text x="380" y="245" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#0369a1">water rises as vapor&#8230;</text>
    <text x="380" y="264" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#0369a1">&#8230;then drips back down</text>
  </g>

  <!-- labels -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14">
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="488" y1="109" x2="560" y2="109"/>
      <line x1="470" y1="160" x2="560" y2="160"/>
      <line x1="440" y1="310" x2="560" y2="310"/>
      <line x1="484" y1="440" x2="560" y2="440"/>
      <line x1="484" y1="486" x2="560" y2="486"/>
      <line x1="484" y1="535" x2="560" y2="535"/>
    </g>
    <g fill="#1e293b">
      <text x="568" y="114" font-weight="700">lid</text>
      <text x="568" y="132" font-size="12" fill="#64748b">keeps water inside</text>
      <text x="568" y="165" font-weight="700">mist</text>
      <text x="568" y="183" font-size="12" fill="#64748b">the starting drink</text>
      <text x="568" y="315" font-weight="700">plants</text>
      <text x="568" y="333" font-size="12" fill="#64748b">tiny sugar factories</text>
      <text x="568" y="445" font-weight="700">soil</text>
      <text x="568" y="463" font-size="12" fill="#64748b">the plant home</text>
      <text x="568" y="491" font-weight="700">charcoal</text>
      <text x="568" y="509" font-size="12" fill="#64748b">keeps the jar fresher</text>
      <text x="568" y="540" font-weight="700">rocks</text>
      <text x="568" y="558" font-size="12" fill="#64748b">a tiny basement for water</text>
    </g>
  </g>

  <text x="380" y="602" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">Build order: rocks &#8594; charcoal &#8594; soil &#8594; plants &#8594; mist &#8594; lid &#8594; indirect light</text>
</svg>
