<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ccyTitle">
  <title id="ccyTitle">A simple carbon cycle loop: carbon in the air enters a leaf, becomes part of an apple, a person eats the apple, and breathing returns the carbon to the air</title>
  <defs>
    <marker id="ccyA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#166534"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="558" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">One Carbon Path (a loop!)</text>

  <!-- loop arrows -->
  <g stroke="#166534" stroke-width="3.5" fill="none">
    <path d="M455,140 A200,155 0 0 1 565,290" marker-end="url(#ccyA)"/>
    <path d="M555,335 A200,155 0 0 1 450,455" marker-end="url(#ccyA)"/>
    <path d="M310,455 A200,155 0 0 1 205,335" marker-end="url(#ccyA)"/>
    <path d="M195,290 A200,155 0 0 1 305,140" marker-end="url(#ccyA)"/>
  </g>

  <!-- nodes -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <!-- air -->
    <g transform="translate(380 115)">
      <ellipse rx="105" ry="42" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
      <text y="-4" font-size="15" font-weight="700" fill="#0369a1">CARBON IN THE AIR</text>
      <text y="16" font-size="12.5" fill="#475569">carbon dioxide (CO&#8322;)</text>
    </g>
    <!-- leaf -->
    <g transform="translate(600 312)">
      <ellipse rx="95" ry="42" fill="#dcfce7" stroke="#166534" stroke-width="2.5"/>
      <text y="-4" font-size="15" font-weight="700" fill="#166534">INTO A LEAF</text>
      <text y="16" font-size="12.5" fill="#475569">the plant builds sugar with it</text>
    </g>
    <!-- apple + person -->
    <g transform="translate(380 480)">
      <ellipse rx="110" ry="42" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
      <text y="-4" font-size="15" font-weight="700" fill="#991b1b">APPLE &#8594; PERSON</text>
      <text y="16" font-size="12.5" fill="#475569">you eat the apple for energy</text>
    </g>
    <!-- breath -->
    <g transform="translate(160 312)">
      <ellipse rx="95" ry="42" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
      <text y="-4" font-size="15" font-weight="700" fill="#5b21b6">BREATH OUT</text>
      <text y="16" font-size="12.5" fill="#475569">carbon returns to the air</text>
    </g>
  </g>

  <text x="380" y="285" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#166534">air &#8594; leaf &#8594; apple &#8594;</text>
  <text x="380" y="306" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#166534">person &#8594; breath &#8594; air</text>
  <text x="380" y="332" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b">the same carbon, reused &#8212;</text>
  <text x="380" y="350" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b">loops, not garbage cans</text>
</svg>
