<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wcTitle">
  <title id="wcTitle">The water cycle: the sun warms the ocean, water rises as vapor, forms clouds, falls as rain or snow, flows through rivers and the ground, and returns to the ocean to start again</title>
  <defs>
    <marker id="wcA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="538" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">The Water Cycle</text>

  <!-- scene -->
  <g>
    <!-- sky backdrop -->
    <rect x="45" y="60" width="770" height="400" rx="12" fill="#f0f9ff"/>
    <!-- sun -->
    <circle cx="120" cy="120" r="30" fill="#fde047"/>
    <g stroke="#fde047" stroke-width="5" stroke-linecap="round">
      <line x1="160" y1="120" x2="180" y2="120"/><line x1="148" y1="148" x2="163" y2="163"/><line x1="120" y1="160" x2="120" y2="180"/>
    </g>
    <!-- mountain -->
    <polygon points="560,460 720,220 815,460" fill="#86efac"/>
    <polygon points="678,283 720,220 762,283 741,275 720,292 699,275" fill="#ffffff"/>
    <!-- cloud -->
    <g fill="#e2e8f0">
      <ellipse cx="500" cy="130" rx="70" ry="30"/>
      <ellipse cx="560" cy="115" rx="55" ry="26"/>
      <ellipse cx="440" cy="118" rx="45" ry="22"/>
    </g>
    <!-- rain -->
    <g stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round">
      <line x1="500" y1="170" x2="492" y2="196"/>
      <line x1="540" y1="170" x2="532" y2="196"/>
      <line x1="580" y1="168" x2="572" y2="194"/>
      <line x1="620" y1="164" x2="612" y2="190"/>
    </g>
    <!-- ocean -->
    <path d="M45,410 Q120,395 200,410 T360,410 T520,410 L520,460 L45,460 Z" fill="#38bdf8"/>
    <rect x="45" y="440" width="770" height="20" fill="#0ea5e9"/>
    <!-- river down the mountain -->
    <path d="M700,300 C670,350 620,380 520,420" stroke="#38bdf8" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- cycle arrows -->
    <g stroke="#0369a1" stroke-width="4" fill="none">
      <!-- evaporation -->
      <path d="M230,395 C245,320 280,220 380,150" marker-end="url(#wcA)"/>
      <!-- condensation to rain handled by cloud; runoff arrow -->
      <path d="M520,430 C420,450 330,450 250,435" marker-end="url(#wcA)"/>
    </g>
  </g>

  <!-- labels -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="180" y="270" fill="#0369a1">1 &#183; the sun warms the water</text>
    <text x="180" y="290" font-weight="400" font-size="12.5" fill="#475569">it rises as invisible vapor (evaporation)</text>
    <text x="405" y="80" fill="#475569">2 &#183; vapor cools into clouds</text>
    <text x="405" y="99" font-weight="400" font-size="12.5" fill="#64748b">(condensation)</text>
    <text x="628" y="140" fill="#0369a1">3 &#183; rain or snow falls</text>
    <text x="628" y="159" font-weight="400" font-size="12.5" fill="#475569">(precipitation)</text>
    <text x="590" y="497" fill="#0369a1">4 &#183; water flows back</text>
    <text x="590" y="516" font-weight="400" font-size="12.5" fill="#475569">rivers and groundwater return it to the ocean</text>
  </g>

  <text x="300" y="497" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b">Same water, going around and around &#8212; for billions of years.</text>
</svg>
