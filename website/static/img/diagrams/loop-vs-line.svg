<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lvTitle">
  <title id="lvTitle">Loop system versus straight-line system: a leaf cycles from tree to soil and back to the tree forever, while a plastic bottle moves from ground to factory to store to use and then gets stuck — the line has no return path</title>
  <defs>
    <marker id="lvG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#166534"/>
    </marker>
    <marker id="lvR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="498" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Loop vs. Line</text>
  <text x="430" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">The shapes do the teaching: one path comes back around, one keeps going one way.</text>

  <!-- LOOP panel -->
  <g>
    <rect x="45" y="85" width="380" height="330" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="2.5"/>
    <text x="235" y="118" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534">THE LEAF LOOP</text>
    <!-- circle of nodes -->
    <g stroke="#166534" stroke-width="3" fill="none">
      <path d="M290,175 A105,95 0 0 1 322,262" marker-end="url(#lvG)"/>
      <path d="M295,320 A105,95 0 0 1 178,322" marker-end="url(#lvG)"/>
      <path d="M148,265 A105,95 0 0 1 182,176" marker-end="url(#lvG)"/>
    </g>
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" text-anchor="middle">
      <g><circle cx="235" cy="165" r="34" fill="#166534"/><text x="235" y="171" fill="#ffffff" font-weight="700">tree</text></g>
      <g><circle cx="322" cy="295" r="34" fill="#22c55e"/><text x="322" y="301" fill="#ffffff" font-weight="700">leaf falls</text></g>
      <g><circle cx="148" cy="295" r="34" fill="#65a30d"/><text x="148" y="301" fill="#ffffff" font-weight="700">soil</text></g>
    </g>
    <text x="235" y="385" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#166534" font-weight="600">the end feeds the beginning &#8212; forever</text>
  </g>

  <!-- LINE panel -->
  <g>
    <rect x="445" y="85" width="380" height="330" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="635" y="118" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#991b1b">THE BOTTLE LINE</text>
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" text-anchor="middle">
      <g><rect x="470" y="150" width="100" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="520" y="175" fill="#1e293b">ground (oil)</text></g>
      <g><rect x="620" y="150" width="100" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="670" y="175" fill="#1e293b">factory</text></g>
      <g><rect x="470" y="235" width="100" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="520" y="260" fill="#1e293b">store</text></g>
      <g><rect x="620" y="235" width="100" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="670" y="260" fill="#1e293b">you use it</text></g>
      <g><rect x="545" y="320" width="110" height="44" rx="8" fill="#7f1d1d"/><text x="600" y="340" fill="#ffffff" font-weight="700">stuck</text><text x="600" y="356" fill="#fca5a5" font-size="11.5">landfill or loose</text></g>
    </g>
    <g stroke="#dc2626" stroke-width="3" fill="none">
      <line x1="570" y1="170" x2="616" y2="170" marker-end="url(#lvR)"/>
      <path d="M670,190 C670,215 570,210 545,232" marker-end="url(#lvR)"/>
      <line x1="570" y1="255" x2="616" y2="255" marker-end="url(#lvR)"/>
      <path d="M670,275 C665,295 640,305 622,318" marker-end="url(#lvR)"/>
    </g>
    <text x="635" y="393" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#991b1b" font-weight="600">no return path &#8212; the material piles up</text>
  </g>

  <text x="430" y="448" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e293b">Straight lines are not foolish &#8212; they are often simpler and cheaper at first.</text>
  <text x="430" y="472" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">The missing piece is the <tspan font-weight="700" fill="#166534">return path</tspan>. Circular design adds one.</text>
</svg>
