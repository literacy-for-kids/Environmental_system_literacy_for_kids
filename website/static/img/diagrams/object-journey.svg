<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ojTitle">
  <title id="ojTitle">The journey of an everyday object: materials from the ground go to a factory, then a store, then get used, then go to recycling or trash — and then to a next place, because away is always somewhere</title>
  <defs>
    <marker id="ojA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#166534"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="298" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Where Does &#8220;Away&#8221; Actually Go?</text>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" text-anchor="middle">
    <g><rect x="40" y="120" width="125" height="70" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/><text x="102" y="150" font-weight="700" fill="#44403c">ground</text><text x="102" y="170" font-size="12" fill="#64748b">raw materials</text></g>
    <g><rect x="200" y="120" width="125" height="70" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><text x="262" y="150" font-weight="700" fill="#a16207">factory</text><text x="262" y="170" font-size="12" fill="#64748b">making + shipping</text></g>
    <g><rect x="360" y="120" width="125" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="422" y="150" font-weight="700" fill="#0369a1">store</text><text x="422" y="170" font-size="12" fill="#64748b">bought + carried home</text></g>
    <g><rect x="520" y="120" width="125" height="70" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="582" y="150" font-weight="700" fill="#166534">use</text><text x="582" y="170" font-size="12" fill="#64748b">sometimes just once</text></g>
    <g><rect x="680" y="120" width="140" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="750" y="150" font-weight="700" fill="#991b1b">recycling or trash</text><text x="750" y="170" font-size="12" fill="#64748b">&#8220;away&#8221;&#8230; but where?</text></g>
  </g>

  <g stroke="#166534" stroke-width="3">
    <line x1="165" y1="155" x2="194" y2="155" marker-end="url(#ojA)"/>
    <line x1="325" y1="155" x2="354" y2="155" marker-end="url(#ojA)"/>
    <line x1="485" y1="155" x2="514" y2="155" marker-end="url(#ojA)"/>
    <line x1="645" y1="155" x2="674" y2="155" marker-end="url(#ojA)"/>
  </g>

  <path d="M750,190 C750,235 720,245 690,248" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ojA)"/>
  <text x="530" y="252" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#991b1b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">the next place: a landfill, a recycling plant, or somewhere it shouldn&#8217;t be</text>

  <text x="430" y="284" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b">&#8220;Away&#8221; is always a real place. The audit this week finds out which one.</text>
</svg>
